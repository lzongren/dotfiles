name: Release dotfiles tools

on:
  push:
    tags:
      - "tools-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tools-vX.Y.Z tag to publish or retry
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "tools-v$version"
          git fetch origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "HEAD^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck shfmt bats lua-check

      - name: Run strict tests
        run: |
          ./remote-dev/test/run.sh --strict
          luacheck hammerspoon/

      - name: Build release assets
        run: ./release/build.sh --tag "$RELEASE_TAG" --output dist

      - name: Smoke test packaged installer
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          prefix="$RUNNER_TEMP/dotfiles-tools-prefix"
          ./release/smoke.sh \
            --bootstrap ./bin/dotfiles-tools \
            --archive "dist/dotfiles-tools-$version.tar.gz" \
            --checksums dist/SHA256SUMS \
            --prefix "$prefix" \
            --version "$version"

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --generate-notes \
            --title "dotfiles-tools $version"
